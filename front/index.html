<style>

:root {

  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }

.card { position: fixed; left: max(16px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top)); max-width: min(340px, calc(100vw - 96px));
  padding: 14px 16px 13px; background: var(--raise); border: 1px solid var(--line); border-radius: 4px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: none; }
.card__back { display: inline-block; margin: -2px 0 9px; font-size: 12.5px; color: var(--ink-dim); text-decoration: none; pointer-events: auto; }
.card__back:hover, .card__back:focus-visible { color: var(--accent); outline: none; }
.card__eyebrow { font: 600 11px/1 var(--font-display); letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
.card__title { margin: 7px 0 5px; font: 600 26px/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }

.prealpha { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
  font: 600 10px/1 var(--font-display); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); pointer-events: none; }
.tools { position: fixed; right: max(16px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); display: grid; gap: 8px; }
.tool { width: 42px; height: 42px; display: grid; place-items: center; padding: 0; color: var(--ink); background: var(--raise);
  border: 1px solid var(--line); border-radius: 4px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: border-color 0.15s, color 0.15s; }

<script>
(function () {
  "use strict";
  const PLATE = "/assets/front/explorer-plate.webp?v=dd872f60e0";
  const RELIEF = "/assets/front/relief.bin?v=e59e10c594";          // gzip of the bake ('VFH1', width, height, uint16 heights, uint8 lava mask): inline, or a path
  const BOARD = [[9,7,3],[9,8,3],[8,8,0],[10,7,3],[8,7,2],[10,8,4],[7,8,0],[11,7,4],[8,9,3],[10,6,2],[9,6,2],[9,9,3],[7,7,0],[11,8,4],[7,9,3],[11,6,2],[8,6,1],[10,9,3],[6,8,0],[12,7,4],[6,9,0],[12,6,2],[6,7,1],[12,8,4],[7,6,1],[11,9,4],[10,5,2],[8,10,3],[7,10,3],[11,5,2],[5,8,0],[13,7,4],[9,5,1],[9,10,3],[5,9,0],[13,6,2],[6,10,3],[12,5,2],[5,7,1],[13,8,4],[8,5,1],[10,10,3],[6,6,1],[12,9,4],[5,10,0],[13,5,2],[4,9,0],[14,6,2],[4,8,0],[14,7,4],[7,5,1],[11,10,4],[7,11,3],[11,4,2],[10,4,1],[8,11,3],[5,6,1],[13,9,4],[4,10,0],[14,5,2],[4,7,1],[14,8,4],[6,11,3],[12,4,2],[9,4,1],[9,11,3],[6,5,1],[12,10,4],[5,11,3],[13,4,2],[3,9,0],[15,6,2],[3,8,0],[15,7,4],[8,4,1],[10,11,3],[3,10,0],[15,5,2],[4,11,0],[14,4,2],[4,6,1],[14,9,4],[3,7,1],[15,8,4],[7,4,1],[11,11,3],[5,5,1],[13,10,4],[2,9,0],[16,6,4],[11,3,1],[7,12,3],[6,12,3],[12,3,2],[3,11,0],[15,4,2],[10,3,1],[8,12,3],[2,8,0],[16,7,4],[2,10,0],[16,5,2],[5,12,3],[13,3,2],[9,3,1],[9,12,3],[6,4,1],[12,11,4],[3,6,1],[15,9,4],[4,12,0],[14,3,2],[4,5,1],[14,10,4],[2,7,0],[16,8,4],[2,11,0],[16,4,2],[8,3,1],[10,12,3],[1,9,0],[17,6,4],[3,12,0],[15,3,2],[1,10,0]];             // the game's 125 grids: [q, r, house] (Tools/front/front_board_layout.json)

  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const touch = window.matchMedia("(pointer: coarse)").matches;

  // FrontFactions: KSH, VLD, DRV, GRV, SHV. MapContent is 2200 × 1200 px; the 125 grids span FrontHexLayout.FieldFraction of
  // it; a map pixel is 0.01 world units (FrontDioramaHeight). The war table stands its highest ground 0.95 tall; the explorer
  // stands it a little taller so a low view reads the peaks.
  const HOUSES = [[200, 50, 60], [212, 162, 60], [74, 144, 194], [99, 217, 122], [142, 91, 194]];
  const HOUSE_NAMES = ["Kashiro", "Valdron", "Darvyn", "Gorvik", "Shenvong"];
  // The lands as the site names them, each the home ground of one house in the opening war (the board's own houses).
  const LANDS = [["snow", "Snow Highlands", 0], ["jungle", "Dense Jungle", 3], ["desert", "Arid Desert / Mesa", 4],
                 ["badlands", "Volcanic Badlands", 2], ["settlement", "The settlement", 1]];
  const MAP_W = 2200, MAP_H = 1200, FIELD = 0.85, WORLD = 0.01, RELIEF_H = 1.1, SQ3 = 1.7320508;
  const W = MAP_W * WORLD, D = MAP_H * WORLD, GROUND = 0.22 * RELIEF_H;   // the plate in world units; the plane a hand holds
  const COLS = touch ? 560 : 1100, ROWS = Math.round(COLS * D / W);     // the relief mesh; the light reads the full bake
  const BEYOND = [0.25, 0.6, 1.1, 1.8, 2.8, 4.2, 6.2, 9, 13, 19, 28];
  const TILT = 38, TILT_MIN = 0, TILT_MAX = 78, FOV = 32, ZOOM_MIN = 0.8, ZOOM_MAX = 12, DEG = Math.PI / 180;
  const SHADOW = [0.027, 0.035, 0.051];   // the page's ground (#07090d): past the plate there is only this
  const REST = { yaw: 0, tilt: TILT, zoom: 1.15, tx: 0, tz: 0 };
  // The painting's sun, up and to the right of the picture: from the north-east, about 35° high (the bake reads it the same way).
  const SUN = (() => { const a = 38 * DEG, e = 35 * DEG; const v = [Math.cos(a) * Math.cos(e), Math.sin(e), Math.sin(a) * Math.cos(e)];
    const l = Math.hypot(...v); return v.map((x) => x / l); })();
  // The river junction: FrontTerrain.JunctionX/Y, the centre of the plate.
  const JUNCTION = [0, 0];

  function layOut(hexes) {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, q0 = 1e9, q1 = -1e9, r0 = 1e9, r1 = -1e9;
    for (const [q, r] of hexes) {
      const ux = SQ3 * (q + r * 0.5), uy = 1.5 * r;
      x0 = Math.min(x0, ux); x1 = Math.max(x1, ux); y0 = Math.min(y0, uy); y1 = Math.max(y1, uy);
      q0 = Math.min(q0, q); q1 = Math.max(q1, q); r0 = Math.min(r0, r); r1 = Math.max(r1, r);
    }
    const R = Math.min(FIELD * MAP_W / (x1 - x0 + SQ3), FIELD * MAP_H / (y1 - y0 + 2));
    return { R, cx: (x0 + x1) * 0.5 * R, cy: (y0 + y1) * 0.5 * R, q0, r0, qs: q1 - q0 + 1, rs: r1 - r0 + 1 };
  }
  const STEPS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  function battlegrounds(hexes) {   // three grids where the most houses meet (illustrative; the game picks them by vote)
    const at = new Map(hexes.map(([q, r, h]) => [q + "," + r, h]));
    const scored = hexes.map(([q, r, h], i) => {
      const others = new Set();
      for (const [dq, dr] of STEPS) { const n = at.get((q + dq) + "," + (r + dr)); if (n !== undefined && n !== h) others.add(n); }
      return { i, score: others.size * 10 + ((i * 37) % 7) };
    }).filter((s) => s.score >= 10).sort((a, b) => b.score - a.score);
    const picked = [];
    for (const s of scored) if (picked.length < 3 && picked.every((p) => Math.abs(p - s.i) > 6)) picked.push(s.i);
    return picked;
  }

  // ── shaders: the war table's, with the light read per pixel from the bake and the painting's own sun ──────────────
  const VS = `#version 300 es
    in vec3 aPos; in vec2 aUv;
    uniform mat4 uViewProj; uniform vec3 uEye;
    out vec2 vUv; out float vDist; out float vHeight;
    void main() { vUv = aUv; vDist = distance(aPos, uEye); vHeight = aPos.y; gl_Position = uViewProj * vec4(aPos, 1.0); }`;
  const FS = `#version 300 es
    precision highp float; precision highp int;
    in vec2 vUv; in float vDist; in float vHeight; out vec4 outColor;
    uniform sampler2D uPlate, uHeight, uLava; uniform highp sampler2D uLookup, uState;
    uniform vec4 uLayout;   // radius, centre x, centre y, time
    uniform vec4 uRange;    // q0, r0, q span, r span
    uniform vec3 uFog;      // haze begins, haze whole, how much of the war to show
    const vec3 SHADOW = vec3(${SHADOW.join(", ")});
    const vec3 SUN = vec3(${SUN.map((x) => x.toFixed(4)).join(", ")});
    const vec3 HAZE = vec3(0.30, 0.36, 0.44);
    const int NQ[6] = int[6](1, 1, 0, -1, -1, 0);
    const int NR[6] = int[6](0, -1, -1, 0, 1, 1);
    const vec2 NN[6] = vec2[6](vec2(1.0, 0.0), vec2(0.5, -0.8660254), vec2(-0.5, -0.8660254),
                               vec2(-1.0, 0.0), vec2(-0.5, 0.8660254), vec2(0.5, 0.8660254));
    int hexAt(int q, int r) {
      int x = q - int(uRange.x), y = r - int(uRange.y);
      if (x < 0 || y < 0 || x >= int(uRange.z) || y >= int(uRange.w)) return -1;
      return int(texelFetch(uLookup, ivec2(x, y), 0).r * 255.0 + 0.5) - 1;
    }
    vec4 state(int id, int row) { return texelFetch(uState, ivec2(id, row), 0); }
    int houseOf(int id) { return id < 0 ? -2 : int(state(id, 0).a * 255.0 + 0.5) - 1; }
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) { vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y); }
    float h(vec2 uv) { return texture(uHeight, vec2(uv.x, 1.0 - uv.y)).r; }   // the bake's row 0 is the plate's top
    void main() {
      float t = uLayout.w;
      vec2 inUv = clamp(vUv, 0.0, 1.0), inset = 3.0 / vec2(textureSize(uPlate, 0));
      float rim = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y) * ${MAP_H}.0 / ${MAP_W}.0);   // plate widths to the edge
      vec3 col = texture(uPlate, mix(inset, 1.0 - inset, inUv)).rgb;
      // The slope under this pixel, from the bake at its own resolution, so a ridge's light is as sharp as the bake.
      vec2 e = 1.0 / vec2(textureSize(uHeight, 0));
      float sx = (h(inUv + vec2(e.x, 0.0)) - h(inUv - vec2(e.x, 0.0))) * ${RELIEF_H} / (2.0 * e.x * ${W}.0);
      float sz = (h(inUv + vec2(0.0, e.y)) - h(inUv - vec2(0.0, e.y))) * ${RELIEF_H} / (2.0 * e.y * ${D}.0);
      vec3 n = normalize(vec3(-sx, 1.0, -sz));
      // The painting already holds its light: the relief only deepens it, measured against flat ground, so a plain keeps
      // its painted colour and a face turned from the sun darkens toward its painted shadow.
      float lit = clamp(dot(n, SUN) / SUN.y, 0.0, 1.6);
      col *= mix(1.0, clamp(0.6 + 0.4 * lit, 0.62, 1.18), 0.6);
      // Valleys hold a little shade: the ground below its neighbourhood darkens slightly.
      float around = (h(inUv + vec2(8.0 * e.x, 0.0)) + h(inUv - vec2(8.0 * e.x, 0.0)) + h(inUv + vec2(0.0, 8.0 * e.y)) + h(inUv - vec2(0.0, 8.0 * e.y))) * 0.25;
      col *= clamp(1.0 + (h(inUv) - around) * 2.4, 0.82, 1.08);
      vec2 c = vUv * vec2(3.2, 1.75) + t * 0.012 * vec2(1.0, 0.35);
      col *= 1.0 - 0.14 * smoothstep(0.5, 0.84, noise(c) * 0.65 + noise(c * 2.3 + 7.1) * 0.35);   // drifting cloud shadow
      if (uFog.z > 0.001) {
        float R = uLayout.x;
        vec2 p = (vUv - 0.5) * vec2(${MAP_W}.0, ${MAP_H}.0) + uLayout.yz;
        float rf = p.y / (1.5 * R), qf = p.x / (1.7320508 * R) - rf * 0.5;
        float xf = qf, zf = rf, yf = -xf - zf;
        float rx = floor(xf + 0.5), ry = floor(yf + 0.5), rz = floor(zf + 0.5);
        float dx = abs(rx - xf), dy = abs(ry - yf), dz = abs(rz - zf);
        if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
        int q = int(rx), r = int(rz), id = hexAt(q, r);
        float aa = max(max(fwidth(p.x), fwidth(p.y)), 1e-4);
        vec3 war = col * 0.84;
        if (id >= 0) {
          war = col;
          vec2 d = p - vec2(1.7320508 * R * (float(q) + float(r) * 0.5), 1.5 * R * float(r));
          vec4 s0 = state(id, 0), s1 = state(id, 1);
          int hh = houseOf(id);
          float half_ = 0.8660254 * R, minBorder = 1e5, minFront = 1e5, heat = s1.r;
          for (int k = 0; k < 6; k++) {
            float ed = half_ - dot(d, NN[k]);
            int nb = hexAt(q + NQ[k], r + NR[k]);
            if (houseOf(nb) != hh) {
              minBorder = min(minBorder, ed);
              if (nb >= 0 && ed < minFront) { minFront = ed; heat = max(s1.r, state(nb, 1).r); }
            }
          }
          float rm = 1.0 - smoothstep(0.0, 0.45 * R, minBorder);
          war = mix(war, s0.rgb, 0.14 + 0.30 * rm * rm);
          war = mix(war, s0.rgb * 1.3 + 0.04, (1.0 - smoothstep(aa, 2.2 * aa, minBorder)) * 0.85);
          if (minFront < 1e4) {
            float glow = exp(-minFront / (0.16 * R)), core = 1.0 - smoothstep(0.8 * aa, 2.0 * aa, minFront);
            war += vec3(1.0, 0.55, 0.2) * (glow * (0.45 + 0.9 * heat) * (0.75 + 0.25 * sin(t * 2.2)) + core * 0.55);

    document.body.classList.add("is-dragging"); kick();
  }, { passive: false });
  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) if (fingers.has(t.identifier)) fingers.set(t.identifier, at(t));
    if (fingers.size >= 2) {
      const [a, b] = [...fingers.values()];
      const now = { mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2, d: Math.hypot(b[0] - a[0], b[1] - a[1]), ang: Math.atan2(b[1] - a[1], b[0] - a[0]) };
      if (pair) {
        let turn = now.ang - pair.ang; if (turn > Math.PI) turn -= 2 * Math.PI; if (turn < -Math.PI) turn += 2 * Math.PI;
        zoomAt(pair.mx, pair.my, now.d / Math.max(1, pair.d));
        turnAt(pair.mx, pair.my, -turn / DEG);
        view.tilt -= (now.my - pair.my) * 0.3; settle();
      }
      pair = now; kick();
    } else if (fingers.size === 1 && lone) {
      const p = [...fingers.values()][0];
      const [dx, dz] = slide(lone[0], lone[1], p[0], p[1]); track(dx, dz);
      lone = p.slice(); kick();
    }
  }, { passive: false });
  const lift = (e) => {
    const wasLone = fingers.size === 1;
    for (const t of e.changedTouches) fingers.delete(t.identifier);
    if (wasLone && fingers.size === 0) fling();
    pair = null;
    lone = fingers.size === 1 ? [...fingers.values()][0].slice() : null;
    if (!fingers.size) document.body.classList.remove("is-dragging");
    kick();
  };
  canvas.addEventListener("touchend", lift); canvas.addEventListener("touchcancel", lift);

  // A view can be named in the address, so a link opens on it: #snow, or #tilt=70&yaw=30&zoom=3&x=-4&z=2.
  function fromAddress() {
    const hash = decodeURIComponent(location.hash.slice(1));
    if (!hash) return;
    if (landViews[hash]) { Object.assign(view, fit(landViews[hash])); mark(hash); engaged = true; settle(); return; }
    const p = new URLSearchParams(hash);
    if (p.has("land") && landViews[p.get("land")]) { Object.assign(view, fit(landViews[p.get("land")])); mark(p.get("land")); }
    for (const [key, name] of [["tilt", "tilt"], ["yaw", "yaw"], ["zoom", "zoom"], ["tx", "x"], ["tz", "z"]]) if (p.has(name)) view[key] = parseFloat(p.get(name));
    if (p.get("war") === "1") { warTarget = war = 1; frontButton.classList.add("is-on"); }
    engaged = true; settle();
  }

  // ── start ────────────────────────────────────────────────────────────────────────────────────────────────────────
  let frame = 0, draw = null, last = 0;
  async function start() {
    try {
      const packed = RELIEF.startsWith("/") ? new Uint8Array(await (await fetch(RELIEF)).arrayBuffer())
                                            : Uint8Array.from(atob(RELIEF), (c) => c.charCodeAt(0));
      // A server may already have unzipped it on the way (Content-Encoding): only gzip's own bytes go through the unzipper.
      const zipped = packed[0] === 0x1f && packed[1] === 0x8b;
      const raw = zipped ? new Uint8Array(await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()) : packed;
      const head = new DataView(raw.buffer, 0, 12);
      if (String.fromCharCode(raw[0], raw[1], raw[2], raw[3]) !== "VFH1") throw new Error("the relief is not a VFH1 bake");
      const bw = head.getInt32(4, true), bh = head.getInt32(8, true);
      const heights = new Uint16Array(raw.buffer.slice(12, 12 + bw * bh * 2));
      const lavaMask = raw.slice(12 + bw * bh * 2, 12 + bw * bh * 3);
      bake = { w: bw, h: bh, heights };
      const plate = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = PLATE; });
      const fights = battlegrounds(BOARD);
      const prog = program(); gl.useProgram(prog);
      const terrain = mesh();
      texture(0, { image: plate, mips: true });
      const hf = new Float32Array(bw * bh); for (let i = 0; i < hf.length; i++) hf[i] = heights[i] / 65535;
      texture(1, { internal: gl.R16F, w: bw, h: bh, format: gl.RED, type: gl.FLOAT, data: hf });
      texture(2, { internal: gl.R8, w: bw, h: bh, format: gl.RED, type: gl.UNSIGNED_BYTE, data: lavaMask });
      const lookup = new Uint8Array(L.qs * L.rs * 4);
      BOARD.forEach(([q, r], i) => { lookup[((r - L.r0) * L.qs + (q - L.q0)) * 4] = i + 1; });
      texture(3, { internal: gl.RGBA8, w: L.qs, h: L.rs, format: gl.RGBA, type: gl.UNSIGNED_BYTE, data: lookup, nearest: true });
      const state = new Uint8Array(128 * 2 * 4);
      BOARD.forEach(([, , h], i) => { state.set([...HOUSES[h], h + 1], i * 4); });
      fights.forEach((i) => { state[(128 + i) * 4] = 255; });
      texture(4, { internal: gl.RGBA8, w: 128, h: 2, format: gl.RGBA, type: gl.UNSIGNED_BYTE, data: state, nearest: true });
      for (const [name, unit] of [["uPlate", 0], ["uHeight", 1], ["uLava", 2], ["uLookup", 3], ["uState", 4]]) gl.uniform1i(gl.getUniformLocation(prog, name), unit);
      gl.uniform4f(gl.getUniformLocation(prog, "uRange"), L.q0, L.r0, L.qs, L.rs);
      const uLayout = gl.getUniformLocation(prog, "uLayout"), uViewProj = gl.getUniformLocation(prog, "uViewProj");
      const uEye = gl.getUniformLocation(prog, "uEye"), uFog = gl.getUniformLocation(prog, "uFog");
      gl.enable(gl.DEPTH_TEST);
      const t0 = performance.now();
      let heading = null;
      draw = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
        if (!w || !h) return;
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        gl.viewport(0, 0, w, h);
        gl.clearColor(SHADOW[0], SHADOW[1], SHADOW[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        const t = calm ? 0 : (performance.now() - t0) / 1000;
        const cam = camera(w / h, t);
        gl.uniform4f(uLayout, L.R, L.cx, L.cy, t);
        gl.uniformMatrix4fv(uViewProj, false, cam.m);
        gl.uniform3f(uEye, cam.eye[0], cam.eye[1], cam.eye[2]);
        gl.uniform3f(uFog, cam.dist * 1.35, cam.dist * 2.6, war);
        gl.bindVertexArray(terrain.vao);
        gl.drawElements(gl.TRIANGLES, terrain.count, gl.UNSIGNED_INT, 0);
        const a = place(view.tx, view.tz), b = place(view.tx, view.tz + 1);
        if (a && b) {
          const deg = Math.round(Math.atan2(b[0] - a[0], a[1] - b[1]) / DEG);
          if (deg !== heading) { heading = deg; needle.style.transform = `rotate(${deg}deg)`; compass.classList.toggle("is-north", Math.abs(deg) < 2); }
        }
      };
      fromAddress();
      if (!engaged) mark("all");
      draw();
      document.documentElement.dataset.ready = "1";
      say(5200);
      kick();
    } catch (err) {
      document.getElementById("fallback").textContent = "The map could not start: " + err.message;
      document.getElementById("fallback").style.display = "grid";
      console.error(err);
    }
  }
  const moving = () => glide || tween || mouse || fingers.size || Math.abs(war - warTarget) > 0.001;
  function loop(now) {
    frame = 0;
    if (!draw) return;
    const dt = last ? Math.min(50, now - last) : 16; last = now;
    step(dt);
    if (war !== warTarget) war = Math.abs(war - warTarget) < 0.02 ? warTarget : war + (warTarget - war) * Math.min(1, dt / 160);
    draw();
    if (!calm || moving()) frame = requestAnimationFrame(loop); else last = 0;
  }
  function kick() { if (!frame && draw) frame = requestAnimationFrame(loop); }
  window.addEventListener("resize", kick);
  window.addEventListener("hashchange", () => { fromAddress(); kick(); });
  document.addEventListener("visibilitychange", kick);
  start();
})();
</script>
</body>
</html>
